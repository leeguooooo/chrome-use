<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* Same tokens as the side panel and settings page. */
  :root { color-scheme:light dark; --bg:#fff; --surface:#f4f5f7; --ink:#1f1f1f; --muted:#6b6f76; --line:#e2e4e8;
    --accent:#1a5fd0; --accent-ink:#fff; --accent-soft:#eef3fd; --ok:#188038; --warning:#b06000; --warning-bg:#fef4e5; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1f1f; --surface:#2b2c2f; --ink:#e8eaed; --muted:#a8acb3; --line:#3c3f44;
    --accent:#8ab4f8; --accent-ink:#1f1f1f; --accent-soft:#25324a; --ok:#81c995; --warning:#fdd663; --warning-bg:#3a3220; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 320px; background: var(--bg); color: var(--ink); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  .logo { width: 32px; height: 32px; flex: none; }
  .logo img { width: 100%; height: 100%; display: block; }
  header .title { font-weight: 650; font-size: 15px; }
  header .tag { color: var(--muted); font-size: 11.5px; }

  main { padding: 0 16px 12px; }
  .status { display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: var(--surface); border-radius: 10px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); position: relative; }
  .dot.on { background: var(--ok); }
  .dot.on::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--ok); opacity: .45; animation: ping 1.8s ease-out infinite; }
  .dot.off { background: var(--warning); }
  @keyframes ping { 0% { transform: scale(.7); opacity: .6; } 100% { transform: scale(1.7); opacity: 0; } }
  .status .grow { flex: 1; min-width: 0; }
  .status .label { font-weight: 600; }
  .status .sub { color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }
  .pill { flex: none; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--accent-soft); color: var(--accent); }
  .pill.hidden { display: none; }

  .desc { color: var(--muted); margin: 10px 2px 0; font-size: 12px; }
  .hint { margin: 10px 0 0; padding: 10px 11px; background: var(--warning-bg); border-radius: 10px; font-size: 12px; display: none; }
  .hint code { display: block; margin-top: 6px; padding: 6px 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
    font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; user-select: all; }

  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button { flex: 1; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 6px 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .actions button:hover { background: var(--surface); }
  .actions button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .actions button.primary:hover { filter: brightness(.94); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  footer { padding: 9px 16px 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  footer .privacy { color: var(--muted); font-size: 11px; margin-right: auto; }
  footer a { color: var(--accent); text-decoration: none; font-size: 11.5px; font-weight: 600; cursor: pointer; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <header>
    <div class="logo"><img src="icons/icon128.png" alt="" /></div>
    <div>
      <div class="title">chrome-use</div>
      <div class="tag" data-i18n="popup_tagline">Local browser automation bridge</div>
    </div>
  </header>

  <main>
    <div class="status">
      <span id="dot" class="dot"></span>
      <div class="grow">
        <div class="label" id="statusLabel" data-i18n="popup_status_checking">Checking…</div>
        <div class="sub" id="statusSub" data-i18n="popup_status_checking_detail">saying hi to your local CLI</div>
      </div>
      <span id="tabPill" class="pill hidden"></span>
    </div>

    <p class="desc"><span data-i18n="popup_desc_before_name">Your local </span><strong>chrome-use</strong><span data-i18n="popup_desc_after_name"> CLI drives your own logged-in Chrome tabs, on this machine, only when you ask.</span></p>

    <div class="hint" id="hint">
      <span id="hintText" data-i18n="popup_hint_check">Check the local CLI connection:</span>
      <code id="hintCommand">chrome-use status</code>
    </div>

    <p class="desc" id="inspectError" hidden></p>
    <div class="actions">
      <button class="primary" data-action="inspect" title="Pick an element on this page and send a change request to your coding agent (Alt+Shift+C)" data-i18n="popup_inspect" data-i18n-title="popup_inspect_title">Inspect element</button>
      <button data-action="options" data-i18n="popup_settings">Settings</button>
    </div>
  </main>

  <footer>
    <span class="privacy" data-i18n="popup_privacy">Runs locally · no tracking</span>
    <a data-href="https://chrome-use.leeguoo.com" data-i18n="popup_docs">Docs</a>
    <a id="repo" data-href="https://github.com/leeguooooo/chrome-use">GitHub</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
