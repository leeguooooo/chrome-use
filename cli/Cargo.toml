[package]
name = "chrome-use"
version = "1.5.276"
edition = "2021"
description = "Fast browser automation CLI for AI agents"
license = "Apache-2.0"
repository = "https://github.com/leeguooooo/chrome-use"
homepage = "https://github.com/leeguooooo/chrome-use"
readme = "../README.md"
keywords = ["browser", "automation", "ai", "cdp", "chrome"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "chrome-use"
path = "src/main.rs"

[features]
# Browser-backed tests are large and ignored by default. Compile them only in
# the dedicated E2E pass so ordinary unit and cross-platform tests stay fast.
e2e-tests = []
# Private metadata-only Windows feasibility probe. No grant/input/wire behavior.
windows-build-identity-prototype = []
# Exact loopback owner metadata only; no broker, browser or input behavior.
windows-tcp-owner-prototype = []

[dependencies]
tempfile = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex-lite = "0.1"
# Pure-Rust JS engine for `chrome-use script <<'JS'` (single-pass scripting).
# Chosen over rquickjs specifically to keep zero C toolchain in cross-builds
# (Windows-msvc / aarch64 / zigbuild) — preserving the single-binary, any-platform
# moat that ego lite (macOS-only) can't match.
boa_engine = "0.20"
dirs = "5.0"
include_dir = "0.7"
base64 = "0.22"
getrandom = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal", "process"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
psl = "2"
uuid = { version = "1", features = ["v4"] }
image = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "stream"] }
sha2 = "0.10"
aes-gcm = "0.10"
async-trait = "0.1"
socket2 = "0.6"
similar = "2"
zip = { version = "8.2.0", default-features = false, features = ["deflate"] }
time = { version = "0.3", features = ["formatting"] }
hmac = "0.12"
# Terminal QR code for `chrome-use mobile pair`; rendering only, no image backend.
qrcode = { version = "0.14", default-features = false }
hex = "0.4"
aes = "0.8"
cbc = "0.1"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha1 = "0.10"
chrono = "0.4"
urlencoding = "2"
rust-embed = "8"
serde_yaml = "0.9"
jsonc-parser = { version = "=0.34.0", features = ["cst", "serde"] }
toml_edit = "=0.25.12"
yaml-edit = { version = "=0.3.2", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_ProcessStatus", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]

[build-dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Thin LTO with parallel codegen, not fat LTO with one unit. Fat LTO redoes
# whole-program optimisation on every build, so a warm dependency cache saved
# nothing on the last step and each release leg took 5+ minutes. Measured on an
# M-series Mac, rebuilding after a change to the main crate: 413s fat, 107s
# thin. The binary grows from 20.6 MB to 27.7 MB (8.8 MB to 10.9 MB gzipped);
# command start-up is unchanged within noise (~5.5 ms).
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true

[profile.ci]
inherits = "dev"
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false
