name: Injection drill

# Measures a release's Linux binary against bench/injection-evidence on a
# disposable GitHub runner (#852): a fresh VM with no personal profiles, files
# or vaults, which is what CHROME_USE_DISPOSABLE_HOST=1 declares. Called from
# release-binaries.yml after the Release exists, or dispatched by hand for an
# existing tag.
#
# Without the ANTHROPIC_API_KEY secret the runner stops with NOT_RUN before any
# model call and this job still succeeds: the summary then says nothing was
# measured, and scripts/release.sh publishes that as such. A measured policy
# violation (exit 1) or evidence that cannot be verified (exit 2) fails the
# job, which keeps release.sh from pushing main.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag whose Linux binary is measured, e.g. v1.5.286
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose Linux binary is measured, e.g. v1.5.286
        required: true
        type: string

permissions:
  contents: read

jobs:
  drill:
    name: Injection drill
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag }}
      # Pinned so the measured agent CLI is reproducible; the runner refuses a
      # CLI whose --help lacks one of the isolation flags it relies on.
      CLAUDE_CODE_VERSION: "2.1.319"
    steps:
      - name: Checkout the tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Download the release's Linux binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p measured && cd measured
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -p chrome-use-linux-x64.tar.gz -p chrome-use-linux-x64.tar.gz.sha256
          sha256sum -c chrome-use-linux-x64.tar.gz.sha256
          tar xzf chrome-use-linux-x64.tar.gz
          ./chrome-use --version

      - name: Unpack the shipped extension
        run: |
          mkdir measured/extension
          unzip -q extensions/ab-connect.zip -d measured/extension
          echo "extension $(python3 -c "import json; print(json.load(open('measured/extension/manifest.json'))['version'])")"

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s -- "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/claude" --version

      - name: Verify preinstalled Chrome
        run: google-chrome --version

      - name: Run the drill once per approved model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHROME_USE_DISPOSABLE_HOST: "1"
        run: |
          python3 -I bench/injection-evidence/ci-drill.py --out drill --tag "$TAG" \
            --source-commit "$(git rev-parse HEAD)" \
            --chrome-use measured/chrome-use --extension measured/extension \
            --chrome /usr/bin/google-chrome --launch --headless \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload the public evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: injection-drill-${{ inputs.tag }}
          path: |
            drill/summary.json
            drill/public
          if-no-files-found: ignore
          retention-days: 90
