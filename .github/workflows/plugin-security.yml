name: Plugin Security Scan
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A new commit on a PR makes the older run obsolete. Pushes to main are keyed
# by SHA, so they never cancel or displace each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635; scanner 3.0.123
        with:
          plugin_dir: .
          min_score: 80
          fail_on_severity: none
          online: false
          upload_sarif: false
