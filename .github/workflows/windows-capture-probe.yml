name: Windows capture probe

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Capture diagnostics, window policy acceptance, or cleanup controls
        type: choice
        options:
          - original
          - candidates
          - window-policy
          - bitwarden
          - baseline
          - cleanup
          - cleanup-relay
        default: candidates
        required: true
      runtime_focus_recovery:
        description: Exercise the production opt-in recovery instead of the Python key prototype
        type: boolean
        required: false
        default: false
      inspect_native_ui:
        description: Collect read-only native document metadata on the CI fixture
        type: boolean
        required: false
        default: false
      grant_foreground_control:
        description: Diagnostic only; compare the same blocked page after its owning cover delegates foreground rights
        type: boolean
        required: false
        default: false
      source_build_run:
        description: Bitwarden only; reuse a verified fresh build with identical product sources
        required: false
        default: ''
      samples:
        description: Fresh-profile repetitions per state and capture kind (1-5)
        required: true
        default: '5'
      rows:
        description: Synthetic 32px rows in the long loopback report (100-3000)
        required: true
        default: '1000'
      dpr:
        description: Emulated device pixel ratio (1 or 2)
        required: true
        default: '1'
      pending_dom_control:
        description: Read the same attachment while capture is pending (disable for an observer-effect control)
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-capture-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CHROME_USE_NO_UPDATE_CHECK: '1'
      PROBE_RUNTIME_FOCUS: ${{ inputs.runtime_focus_recovery }}
      PROBE_INSPECT_NATIVE_UI: ${{ inputs.inspect_native_ui }}
      PROBE_FOREGROUND_CONTROL: ${{ inputs.grant_foreground_control }}
      SOURCE_BUILD_RUN: ${{ inputs.source_build_run }}
      PROBE_EXPERIMENT: ${{ inputs.experiment }}
      PROBE_SAMPLES: ${{ inputs.samples }}
      PROBE_ROWS: ${{ inputs.rows }}
      PROBE_DPR: ${{ inputs.dpr }}
      PROBE_PENDING_DOM: ${{ inputs.pending_dom_control }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate source replay selection
        shell: pwsh
        run: |
          if ($env:SOURCE_BUILD_RUN -and ($env:PROBE_EXPERIMENT -ne 'bitwarden' -or $env:SOURCE_BUILD_RUN -notmatch '^[0-9]+$')) { throw 'Source replay requires a numeric build run and the Bitwarden experiment' }
          if ($env:PROBE_FOREGROUND_CONTROL -eq 'true' -and ($env:PROBE_EXPERIMENT -ne 'bitwarden' -or $env:PROBE_RUNTIME_FOCUS -ne 'true')) { throw 'Foreground control requires Bitwarden runtime recovery' }
          if ($env:PROBE_SAMPLES -notmatch '^[1-5]$') { throw 'samples must be 1-5' }
      - if: inputs.experiment != 'cleanup' && inputs.experiment != 'cleanup-relay' && inputs.source_build_run == ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Verify detached Windows stderr handles without a browser
        if: inputs.experiment != 'cleanup' && inputs.experiment != 'cleanup-relay' && inputs.source_build_run == ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path probe-artifacts -Force | Out-Null
          rustc --edition 2024 bench/windows-capture-798/stdio_probe.rs -o probe-artifacts/stdio-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'stderr regression probe failed to compile' }
          & ./probe-artifacts/stdio-probe.exe 2>&1 | Tee-Object probe-artifacts/stdio-probe.log
          if ($LASTEXITCODE -ne 0) { throw 'stderr regression probe failed' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - if: inputs.experiment != 'cleanup' && inputs.experiment != 'cleanup-relay'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Check Bitwarden controller without a browser
        if: inputs.experiment == 'bitwarden'
        run: python -m unittest discover -s bench/bitwarden-780 -p 'test_*.py'
      - name: Install decoder for pure image checks
        if: inputs.experiment != 'cleanup' && inputs.experiment != 'cleanup-relay'
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Check fixture and diagnostic generator without a browser
        if: inputs.experiment != 'cleanup' && inputs.experiment != 'cleanup-relay'
        run: python bench/windows-capture-798/test_probe.py
      - if: inputs.experiment != 'cleanup' && inputs.experiment != 'cleanup-relay' && inputs.source_build_run == ''
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
          key: x86_64-pc-windows-msvc-release
          cache-on-failure: true
      - name: Reuse a verified identical source CLI
        if: inputs.experiment == 'bitwarden' && inputs.source_build_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bench/bitwarden-780/reuse_source.py --run "$env:SOURCE_BUILD_RUN" --output probe-artifacts
      - name: Validate inputs and build the exact Release CLI
        if: inputs.experiment != 'cleanup' && inputs.experiment != 'cleanup-relay' && inputs.source_build_run == ''
        shell: pwsh
        run: |
          if ($env:PROBE_EXPERIMENT -notmatch '^(original|candidates|baseline|window-policy|bitwarden)$') { throw 'invalid experiment' }
          if ($env:PROBE_SAMPLES -notmatch '^[1-5]$') { throw 'samples must be 1-5' }
          if ($env:PROBE_ROWS -notmatch '^[0-9]+$' -or [int]$env:PROBE_ROWS -lt 100 -or [int]$env:PROBE_ROWS -gt 3000) { throw 'rows must be 100-3000' }
          if ($env:PROBE_DPR -notmatch '^[12]$') { throw 'dpr must be 1 or 2' }
          if ($env:PROBE_PENDING_DOM -notmatch '^(true|false)$') { throw 'pending_dom_control must be true or false' }
          New-Item -ItemType Directory -Path probe-artifacts -Force | Out-Null
          cargo build --release --locked --manifest-path cli/Cargo.toml --target x86_64-pc-windows-msvc 2>&1 | Tee-Object probe-artifacts/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          $binary = (Resolve-Path cli/target/x86_64-pc-windows-msvc/release/chrome-use.exe).Path
          "PROBE_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-FileHash $binary -Algorithm SHA256 | Format-List | Out-File probe-artifacts/binary-sha256.txt
          Copy-Item $binary probe-artifacts/source-cli.exe
          @{mode='built';gitSha=$env:GITHUB_SHA;sourceBuildRun=$env:GITHUB_RUN_ID;binarySha256=(Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant()} | ConvertTo-Json | Out-File probe-artifacts/source-build.json -Encoding utf8
          "PROBE_BINARY_BUILD_SHA=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PROBE_BINARY_SOURCE=built" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cargo --version | Out-File probe-artifacts/toolchain.txt
          rustc --version | Out-File probe-artifacts/toolchain.txt -Append
      - name: Verify native focus authority before browser acceptance
        if: inputs.experiment == 'bitwarden' && inputs.source_build_run == ''
        shell: pwsh
        run: |
          if (-not (Test-Path cli/src/native/focus_recovery.rs)) { throw 'Native focus authority source is absent' }
          $arguments = @('test', '--release', '--locked', '--manifest-path', 'cli/Cargo.toml', '--target', 'x86_64-pc-windows-msvc', '--bin', 'chrome-use', 'focus_recovery')
          $cases = & cargo @arguments -- --list
          if ($LASTEXITCODE -ne 0) { throw 'Native focus tests failed to compile' }
          foreach ($required in @('real_native_document_shape_keeps_the_menu_under_its_page', 'standalone_test_process_cannot_claim_chrome_parent_authority', 'only_current_root_can_grant_one_attempt')) {
            if (-not ($cases -match "${required}: test$")) { throw "Required native focus test absent: $required" }
          }
          & cargo @arguments -- --test-threads=1 2>&1 | Tee-Object probe-artifacts/native-focus-tests.log
          if ($LASTEXITCODE -ne 0) { throw 'Native focus authority tests failed' }
      - name: Install isolated Chrome for Testing and image decoder
        if: inputs.experiment != 'cleanup' && inputs.experiment != 'cleanup-relay'
        shell: pwsh
        run: |
          & $env:PROBE_BINARY install 2>&1 | Tee-Object probe-artifacts/chrome-install.log
          if ($LASTEXITCODE -ne 0) { throw 'Chrome for Testing install failed' }
          $chrome = Get-ChildItem -Path (Join-Path $env:USERPROFILE '.chrome-use/browsers') -Filter chrome.exe -Recurse |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $chrome) { throw 'Installed Chrome for Testing executable not found' }
          "PROBE_CHROME=$($chrome.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Image decoder install failed' }
          python -m pip freeze | Out-File probe-artifacts/python-packages.txt
      - name: Run the Windows relay capture matrix
        if: inputs.experiment != 'cleanup' && inputs.experiment != 'cleanup-relay' && inputs.experiment != 'bitwarden'
        shell: pwsh
        run: |
          $control = if ($env:PROBE_PENDING_DOM -eq 'true') { '--pending-dom-control' } else { '--no-pending-dom-control' }
          python bench/windows-capture-798/probe.py $control --experiment $env:PROBE_EXPERIMENT --binary "$env:PROBE_BINARY" --chrome "$env:PROBE_CHROME" --extension extensions/ab-connect --output probe-artifacts/results --samples $env:PROBE_SAMPLES --rows $env:PROBE_ROWS --dpr $env:PROBE_DPR
          if ($LASTEXITCODE -ne 0) { throw "Probe verdict is not PASS (exit $LASTEXITCODE); inspect summary and raw evidence" }
      - name: Probe the official Bitwarden menu in disposable source-CLI profiles
        if: inputs.experiment == 'bitwarden'
        shell: pwsh
        run: |
          $binary = $env:PROBE_BINARY
          $chrome = $env:PROBE_CHROME
          if (-not (Test-Path $binary) -or -not (Test-Path $chrome)) { throw 'Exact source CLI or Chrome is absent' }
          $bwArchive = Join-Path $env:RUNNER_TEMP 'bw780-official.zip'
          $bwDir = Join-Path $env:RUNNER_TEMP 'bw780-official'
          curl.exe --fail --location --max-time 120 'https://github.com/bitwarden/clients/releases/download/browser-v2026.10.1/dist-chrome-2026.10.1.zip' --output $bwArchive
          if ($LASTEXITCODE -ne 0) { throw 'Official Bitwarden download failed' }
          if ((Get-FileHash $bwArchive -Algorithm SHA256).Hash -ne 'd7c2d924f0d21ccb36f57e39bdaf732732644e94db95d5dd967629d8b878b93a') { throw 'Official Bitwarden archive hash mismatch' }
          Expand-Archive -Path $bwArchive -DestinationPath $bwDir
          Get-FileHash $binary,$bwArchive -Algorithm SHA256 | Format-List | Out-File probe-artifacts/input-hashes.txt
          $verdicts = @()
          $inspection = @()
          if ($env:PROBE_INSPECT_NATIVE_UI -eq 'true') { $inspection = @('--inspect-native-ui') }
          if ($env:PROBE_RUNTIME_FOCUS -eq 'true') { $inspection += '--runtime-focus-recovery' }
          $modes = @('default', 'foreground', 'background')
          if ($env:PROBE_FOREGROUND_CONTROL -eq 'true') {
            $inspection += '--grant-chrome-foreground'
            $modes = @(1..[int]$env:PROBE_SAMPLES | ForEach-Object { "background-$_" })
          }
          foreach ($mode in $modes) {
            $output = "probe-artifacts/bitwarden-$mode"
            $setupMode = if ($env:PROBE_FOREGROUND_CONTROL -eq 'true') { 'background' } else { $mode }
            python bench/bitwarden-780/probe.py --binary $binary --chrome $chrome --extension extensions/ab-connect --bitwarden $bwDir --output $output --setup-mode $setupMode @inspection
            $verdicts += $LASTEXITCODE
            $summary = Get-Content "$output/summary.json" -Raw | ConvertFrom-Json
            if ($summary.browserStarted -ne $true) { throw 'Fixture prerequisites unavailable; no browser was started' }
            if ($summary.sessionCleanupConfirmed -ne $true -or $summary.fixtureCleanupError) { throw 'Session/fixture cleanup unconfirmed; refusing another profile' }
            if ($summary.registryRestored -ne $true) { throw 'Native-host registry restoration unknown; refusing another profile' }
            if ($summary.browserCleanup.verified -ne $true -or $summary.coverCleanupError) { throw 'Cleanup unknown; refusing another fixture profile' }
          }
          if (@($verdicts | Where-Object { $_ -ne 0 }).Count -ne 0) { throw 'Real-extension diagnostic is not PASS; inspect evidence and scope' }
      - name: Diagnose owned Chrome process-tree cleanup without a CLI build
        if: inputs.experiment == 'cleanup' || inputs.experiment == 'cleanup-relay'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path probe-artifacts -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'cleanup-chrome.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'cleanup-chrome'
          curl.exe --fail --location --max-time 120 'https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/win64/chrome-win64.zip' --output $archive
          if ($LASTEXITCODE -ne 0) { throw 'Chrome for Testing download failed' }
          Expand-Archive -Path $archive -DestinationPath $destination
          $chrome = Join-Path $destination 'chrome-win64/chrome.exe'
          $extra = @()
          if ($env:PROBE_EXPERIMENT -eq 'cleanup-relay') {
            $cliArchive = Join-Path $env:RUNNER_TEMP 'reference-cli.tar.gz'
            $checksum = "$cliArchive.sha256"
            $cliDir = Join-Path $env:RUNNER_TEMP 'reference-cli'
            $base = 'https://github.com/leeguooooo/chrome-use/releases/download/v1.5.276/chrome-use-win32-x64.tar.gz'
            curl.exe --fail --location --max-time 120 $base --output $cliArchive
            if ($LASTEXITCODE -ne 0) { throw 'Reference CLI download failed' }
            curl.exe --fail --location --max-time 60 "$base.sha256" --output $checksum
            if ($LASTEXITCODE -ne 0) { throw 'Reference CLI checksum download failed' }
            $expected = ((Get-Content $checksum -Raw).Trim() -split '\s+')[0]
            if ((Get-FileHash $cliArchive -Algorithm SHA256).Hash -ne $expected) { throw 'Reference archive checksum mismatch' }
            New-Item -ItemType Directory -Path $cliDir -Force | Out-Null
            tar -xzf $cliArchive -C $cliDir
            if ($LASTEXITCODE -ne 0) { throw 'Reference CLI extraction failed' }
            $executables = @(Get-ChildItem $cliDir -Filter chrome-use.exe -Recurse)
            if ($executables.Count -ne 1) { throw 'Reference CLI executable is ambiguous or absent' }
            $extra = @('--binary', $executables[0].FullName, '--extension', 'extensions/ab-connect')
          }
          python bench/windows-capture-798/cleanup_probe.py --chrome $chrome --output probe-artifacts/cleanup @extra
          if ($LASTEXITCODE -ne 0) { throw 'Cleanup diagnostic is not PASS; inspect raw taskkill output' }
      - name: Retain diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-capture-${{ github.sha }}-${{ inputs.experiment }}-dpr${{ inputs.dpr }}
          path: probe-artifacts
          retention-days: 14
          if-no-files-found: warn
