name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new PR commit makes its older run obsolete. Main uses the commit SHA so a
# later documentation-only push cannot displace an unverified code revision.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      run_heavy: ${{ steps.changes.outputs.run_heavy }}
      run_rust: ${{ steps.changes.outputs.run_rust }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          run_heavy=true

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if git diff --quiet "origin/${BASE_REF}...HEAD" -- . ':(exclude)docs/**'; then
              run_heavy=false
            fi
          elif [[ "$EVENT_NAME" == "push" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            if git diff --quiet "$BEFORE_SHA" "$CURRENT_SHA" -- . ':(exclude)docs/**'; then
              run_heavy=false
            fi
          fi

          # PRs that touch nothing the Rust crate compiles in or reads at test
          # time (e.g. release scripts, docs) skip the Rust jobs. Main pushes
          # always run them.
          run_rust=$run_heavy
          if [[ "$EVENT_NAME" == "pull_request" && "$run_heavy" == "true" ]]; then
            if git diff --quiet "origin/${BASE_REF}...HEAD" -- \
                cli extensions skills skill-data packages package.json \
                .node-version .github/workflows/ci.yml; then
              run_rust=false
            fi
          fi

          echo "run_heavy=$run_heavy" >> "$GITHUB_OUTPUT"
          echo "run_rust=$run_rust" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Check version sync
        run: node scripts/check-version-sync.js

      - name: Test release notes extraction
        run: node --test scripts/release-notes.test.js

      - name: Stealth benchmark native locale controls
        run: node --test scripts/stealth-bench.test.js

      - name: Monaco clipboard transaction payload tests
        run: node --test scripts/monaco-clipboard.test.js scripts/monaco-model.test.js

      - name: Test contributor hook in sandbox
        run: |
          docker pull node:24-bookworm
          sh scripts/test-pre-push-sandbox.sh

      - name: Test shell installer completion
        run: sh scripts/test-install.sh

      - name: Test shell installer app-bundle placement
        run: sh scripts/test-install-app-bundle.sh

      - name: Check skills frontmatter
        run: python3 scripts/check-skills-frontmatter.py

      - name: Test hover recorder lifecycle
        if: steps.changes.outputs.run_heavy == 'true'
        run: node --test scripts/hover-recorder.test.js
      - name: Test double-click recorder
        if: steps.changes.outputs.run_heavy == 'true'
        run: node --test scripts/double-click.test.js

      - name: Run extension tests
        if: steps.changes.outputs.run_heavy == 'true'
        run: node --test extensions/ab-connect/*.test.js

      - name: Warn when doc sources change without their generated pages
        if: github.event_name == 'pull_request'
        env:
          DOCS_CHECK_GHA: "1"
          DOCS_CHECK_DIFF: origin/${{ github.base_ref }}...HEAD
        run: node scripts/check-docs-staleness.js

      - name: Setup Rustfmt
        if: steps.changes.outputs.run_rust == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Format check
        if: steps.changes.outputs.run_rust == 'true'
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

  rust:
    name: Rust Tests
    needs: preflight
    if: needs.preflight.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    # Compilation, unit tests and the serial browser suite share this budget.
    # Recent runs reached 20 minutes while browser tests were still passing.
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js for verification probe tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
          shared-key: linux-ci

      # PRs split the test binaries with the Rust PR Tests shard jobs. They
      # run one after another, so three shards on three runners cut the wall
      # time.
      - name: Run Rust tests (shard 0)
        if: github.event_name == 'pull_request'
        run: cargo test --profile ci --manifest-path cli/Cargo.toml $(sh scripts/ci-test-shard.sh 0)

      # Enabling the internal feature here compiles the ignored browser tests
      # into the same test binary. The following E2E step can then reuse it.
      - name: Run Rust tests with E2E support
        if: github.event_name != 'pull_request'
        run: cargo test --profile ci --features e2e-tests --manifest-path cli/Cargo.toml

      - name: Verify preinstalled Chrome
        if: github.event_name != 'pull_request'
        run: google-chrome --version

      - name: Install ffmpeg
        if: github.event_name != 'pull_request'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run native E2E tests
        if: github.event_name != 'pull_request'
        env:
          AGENT_BROWSER_ALLOW_HEADLESS: "1"
          AGENT_BROWSER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: cargo test --profile ci --features e2e-tests --manifest-path cli/Cargo.toml e2e -- --ignored --test-threads=1

  rust-pr-shard:
    name: Rust PR Tests (shard ${{ matrix.shard }})
    needs: preflight
    if: needs.preflight.outputs.run_rust == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js for verification probe tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
          shared-key: linux-ci
          save-if: false
      - name: Run Rust tests (shard ${{ matrix.shard }})
        run: cargo test --profile ci --manifest-path cli/Cargo.toml $(sh scripts/ci-test-shard.sh ${{ matrix.shard }})

  rust-lint:
    name: Rust Clippy
    needs: preflight
    if: needs.preflight.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
          shared-key: linux-ci

      # Clippy runs beside the test job instead of adding its separate full
      # dependency compilation to the test job's critical path.
      - name: Clippy check
        run: cargo clippy --profile ci --manifest-path cli/Cargo.toml -- -D warnings

  rust-e2e-compile:
    name: Rust E2E Compile
    needs: preflight
    if: needs.preflight.outputs.run_rust == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
          shared-key: linux-ci

      # Keep the large browser test module out of ordinary PR test binaries,
      # but compile-check it in parallel so broken E2E code cannot be merged.
      - name: Check E2E test code
        run: cargo check --profile ci --tests --features e2e-tests --manifest-path cli/Cargo.toml

  rust-cross:
    name: Rust (${{ matrix.os }} - ${{ matrix.target }})
    needs: preflight
    if: needs.preflight.outputs.run_heavy == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          # Run Intel tests natively. Running them through Rosetta on the arm64
          # runner was the slowest and flakiest leg in the entire workflow.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}-ci

      - name: Run Rust tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Retain a verified Mac native-probe build
        if: always() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          NATIVE_PROBE_TARGET: ${{ matrix.target }}
          CHROME_USE_NO_UPDATE_CHECK: '1'
        run: |
          test -f cli/src/native/focus_recovery/macos_probe.rs
          cargo build --profile ci --locked --manifest-path cli/Cargo.toml --target "$NATIVE_PROBE_TARGET" --bin chrome-use
          python3 - <<'PYBUILD'
          import hashlib,json,os,pathlib,shutil,subprocess
          target=os.environ['NATIVE_PROBE_TARGET']
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert source==os.environ['GITHUB_SHA']
          binary=pathlib.Path('cli/target')/target/'ci/chrome-use'
          output=pathlib.Path('native-probe-build');output.mkdir(exist_ok=True)
          shutil.copyfile(binary,output/'chrome-use')
          receipt={'gitSha':source,'target':target,'profile':'ci','binarySha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'cargo':subprocess.check_output(['cargo','--version'],text=True).strip(),'rustc':subprocess.check_output(['rustc','--version'],text=True).strip(),'browserAcceptance':False,'nativeHostPermissionEvidence':False}
          (output/'build.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PYBUILD
      - name: Upload Mac native-probe build receipt
        if: always() && runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-probe-build-${{ matrix.target }}-${{ github.sha }}
          path: native-probe-build
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify skill extraction with the built Windows CLI
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-install-windows.ps1 -ChromeUse "$pwd/cli/target/${{ matrix.target }}/ci/chrome-use.exe"

  windows-installer:
    name: Windows Installer Scripts
    needs: preflight
    if: needs.preflight.outputs.run_heavy == 'true'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-install-windows.ps1
      - name: Test PowerShell 7
        shell: pwsh
        run: ./scripts/test-install-windows.ps1

  windows-integration:
    name: Windows Integration and Global Install
    needs: preflight
    if: needs.preflight.outputs.run_heavy == 'true' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AGENT_BROWSER_ALLOW_HEADLESS: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
          key: x86_64-pc-windows-msvc-release

      - name: Build Rust CLI
        run: cargo build --release --manifest-path cli/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Copy CLI binary to bin directory
        run: |
          Copy-Item cli/target/x86_64-pc-windows-msvc/release/chrome-use.exe bin/chrome-use-win32-x64.exe

      - name: Test chrome-use install command
        run: |
          $env:PATH = "$pwd\bin;$env:PATH"
          for ($i = 1; $i -le 3; $i++) {
            bin/chrome-use-win32-x64.exe install
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Attempt $i failed, retrying in 10 seconds..."
            Start-Sleep -Seconds 10
          }
          exit 1
        shell: pwsh
        timeout-minutes: 10

      - name: Test chrome-use extension install
        run: |
          $env:PATH = "$pwd\bin;$env:PATH"
          bin/chrome-use-win32-x64.exe extension install --json
          if ($LASTEXITCODE -ne 0) { Write-Host "extension install failed"; exit 1 }
          $key = "HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.agent_browser.connect"
          $manifest = (Get-ItemProperty -Path $key -ErrorAction Stop).'(default)'
          if (-not (Test-Path $manifest)) { Write-Host "manifest missing: $manifest"; exit 1 }
          Write-Host "OK: registered host manifest at $manifest"
        shell: pwsh
        timeout-minutes: 5

      - name: Test daemon lifecycle
        run: |
          $env:PATH = "$pwd\bin;$env:PATH"
          bin/chrome-use-win32-x64.exe --launch open https://example.com
          if ($LASTEXITCODE -ne 0) { Write-Error "open failed"; exit 1 }
          $snapshot = bin/chrome-use-win32-x64.exe snapshot
          if ($LASTEXITCODE -ne 0) { Write-Error "snapshot failed"; exit 1 }
          Write-Host $snapshot
          bin/chrome-use-win32-x64.exe close
          if ($LASTEXITCODE -ne 0) { Write-Error "close failed"; exit 1 }
        shell: pwsh
        timeout-minutes: 5

      # Reuse the release binary above instead of compiling it again in a
      # separate Windows global-install matrix job.
      - name: Test npm global install
        run: |
          npm pack
          npm install -g chrome-use-*.tgz
          chrome-use --version
        shell: bash

      - name: Verify installed CLI works
        run: |
          $ver = chrome-use --version
          if ($LASTEXITCODE -ne 0) { Write-Error "chrome-use --version failed"; exit 1 }
          Write-Host "CLI version: $ver"
          $content = Get-Content "$(npm prefix -g)\chrome-use.cmd" -Raw
          Write-Host "Shim content:"
          Write-Host $content
          if ($content -match "chrome-use-win32-x64\.exe") {
            Write-Host "OK: shim points directly to the native binary"
          } else {
            Write-Host "INFO: shim uses the functional JavaScript wrapper"
          }
        shell: pwsh

  global-install:
    name: Global Install (${{ matrix.os }})
    needs: preflight
    if: needs.preflight.outputs.run_heavy == 'true' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: chrome-use-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: chrome-use-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}-release

      - name: Build Rust CLI
        run: cargo build --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Copy CLI binary to bin directory
        run: cp cli/target/${{ matrix.target }}/release/chrome-use bin/${{ matrix.binary }}

      - name: Test npm global install
        run: |
          npm pack
          npm install -g chrome-use-*.tgz
          chrome-use --version
        shell: bash

      - name: Verify symlink points to native binary
        run: |
          SYMLINK=$(npm prefix -g)/bin/chrome-use
          TARGET=$(readlink "$SYMLINK")
          echo "Symlink: $SYMLINK"
          echo "Target: $TARGET"
          if [[ "$TARGET" != *"${{ matrix.binary }}"* ]]; then
            echo "ERROR: Symlink should point to native binary, not JavaScript wrapper"
            exit 1
          fi
          echo "Symlink correctly points to native binary"
        shell: bash
