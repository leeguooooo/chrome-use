name: Injection evidence checks

on:
  pull_request:
    paths:
      - 'bench/injection-evidence/**'
      - '.github/workflows/injection-evidence-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check synthetic receipts without a model or browser
        run: python3 bench/injection-evidence/test_verify.py
