name: Release binaries

# Build per-platform binaries and attach them to the GitHub Release for the
# pushed tag. No npm, no tokens — only the built-in GITHUB_TOKEN. Consumers
# install with: curl -fsSL .../install.sh | sh
#
# A tag can only restore caches saved on the default branch, and a cache saved
# on a tag is readable by no other tag. So release runs never save: every one
# of them used to compile all dependencies from nothing (16-30 minutes) and
# leave 2 GB of cache behind that nothing could read. The same build matrix
# now also runs on main, daily and when this file changes, only to keep those
# caches warm. It signs, packages and publishes nothing.
#
# Dry run: dispatch it on a branch with no tag. It builds, signs, notarizes
# and packages that branch and keeps the archives as workflow artifacts for
# three days; nothing is published.
#
# Not on every `cli/Cargo.lock` change: a release bumps the version in it, so
# each release started seven cache builds that took runners from the next one.
# A dependency bump is picked up by the next daily run; until then a release
# restores the older cache and compiles only what changed.
on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      - '.github/workflows/release-binaries.yml'
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build binaries for, e.g. v0.27.0-fork.12. Empty: dry run of the selected branch, nothing is published'
        required: false

permissions:
  contents: read

concurrency: release-binaries-${{ github.event.inputs.tag || github.ref_name }}

env:
  # False on the cache-warming runs (main, schedule).
  IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
  CARGO_ZIGBUILD_VERSION: "0.23.0"
  ZIG_VERSION: "0.16.0"

jobs:
  validate:
    name: Validate release version and notes
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Check packaged version and reviewed notes
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          node scripts/check-version-sync.js
          node scripts/release-notes.js "$RELEASE_TAG" > /dev/null

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    # Runs after a skipped `validate` too: that is a cache-warming run.
    if: ${{ !cancelled() && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The `secrets` context is NOT allowed in a step-level `if:` — a workflow
    # that uses it there is rejected wholesale, with no jobs and no log to read.
    # Hoisting the check into a job-level env var is the supported form, and the
    # one leeguooooo/iphone-use already uses.
    env:
      HAS_SIGNING: ${{ secrets.APPLE_SIGNING_CERTIFICATE != '' && secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGN_IDENTITY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64,        os: ubuntu-latest, target: x86_64-unknown-linux-gnu,    asset: chrome-use-linux-x64,        use_zigbuild: true,  ext: '' }
          - { name: Linux ARM64,      os: ubuntu-latest, target: aarch64-unknown-linux-gnu,   asset: chrome-use-linux-arm64,      use_zigbuild: true,  ext: '' }
          - { name: Linux musl x64,   os: ubuntu-latest, target: x86_64-unknown-linux-musl,   asset: chrome-use-linux-musl-x64,   use_zigbuild: true,  ext: '' }
          - { name: Linux musl ARM64, os: ubuntu-latest, target: aarch64-unknown-linux-musl,  asset: chrome-use-linux-musl-arm64, use_zigbuild: true,  ext: '' }
          - { name: Windows x64,      os: ubuntu-latest, target: x86_64-pc-windows-gnu,       asset: chrome-use-win32-x64,        use_zigbuild: false, ext: '.exe' }
          # Cross-compiled on the ARM runner. The Intel one was the slowest leg
          # by far (14 minutes on a good day, past the 30-minute timeout on a
          # bad one). CI still runs the tests on real Intel hardware.
          - { name: macOS x64,        os: macos-latest,  target: x86_64-apple-darwin,         asset: chrome-use-darwin-x64,       use_zigbuild: false, ext: '' }
          - { name: macOS ARM64,      os: macos-latest,  target: aarch64-apple-darwin,        asset: chrome-use-darwin-arm64,     use_zigbuild: false, ext: '' }
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}-release-zig-${{ env.ZIG_VERSION }}-cargo-zigbuild-${{ env.CARGO_ZIGBUILD_VERSION }}
          save-if: ${{ env.IS_RELEASE != 'true' }}

      - name: Install MinGW
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        # The maintained Python package provides both cargo-zigbuild and Zig as
        # wheels, avoiding a Rust tool build and cross-GCC installs in each leg.
        run: pip3 install "cargo-zigbuild==${CARGO_ZIGBUILD_VERSION}" "ziglang==${ZIG_VERSION}"

      - name: Configure MinGW linker
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.x86_64-pc-windows-gnu]
          linker = "x86_64-w64-mingw32-gcc"
          EOF
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc" >> "$GITHUB_ENV"

      - name: Prepare matched Windows foreground build
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          cargo fetch --locked --manifest-path cli/Cargo.toml
          cargo metadata --locked --offline --manifest-path cli/Cargo.toml --format-version 1 --filter-platform x86_64-pc-windows-gnu --features windows-build-identity-prototype,windows-tcp-owner-prototype > "$RUNNER_TEMP/windows-build-metadata.json"
          echo "CHROME_USE_MARKER_DEPENDENCIES=$RUNNER_TEMP/windows-build-metadata.json" >> "$GITHUB_ENV"
          python3 -c 'import secrets; print("CHROME_USE_BUILD_GENERATION=" + secrets.token_hex(16))' >> "$GITHUB_ENV"

      - name: Build (zigbuild)
        if: matrix.use_zigbuild
        run: cargo zigbuild --release --manifest-path cli/Cargo.toml --target ${{ matrix.target }}

      - name: Build (cargo)
        if: '!matrix.use_zigbuild'
        shell: bash
        run: |
          feature_args=()
          if [[ "${{ matrix.target }}" == x86_64-pc-windows-gnu ]]; then
            feature_args=(--features 'windows-build-identity-prototype,windows-tcp-owner-prototype')
          fi
          cargo build --release --locked --manifest-path cli/Cargo.toml --target "${{ matrix.target }}" "${feature_args[@]}"

      # Sign and notarize the macOS binaries. Ad-hoc signed ones are rejected
      # by `spctl`, so a copy downloaded through a browser (which carries a
      # quarantine flag) is refused by Gatekeeper. Signed + notarized reports
      # `accepted / source=Notarized Developer ID`.
      #
      # Note for whoever reads this next: the `rc=137` SIGKILL that install
      # steps sometimes hit is NOT a signature problem. It comes from
      # overwriting a binary while a process is executing it — `install.sh`
      # uses `mv` (a rename), which is why it never sees this, and `cp` over
      # the same path is what fails. Measured, after this comment first said
      # otherwise.
      #
      # Skipped, not failed, when the secrets are absent: a fork building a tag
      # has no certificate, and an unsigned build is still a usable build.
      - name: Sign and notarize (macOS)
        if: env.IS_RELEASE == 'true' && startsWith(matrix.os, 'macos') && env.HAS_SIGNING == 'true'
        env:
          # Same secret names as leeguooooo/iphone-use, which already signs and
          # notarizes this way — one convention across the repos, not two.
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          bin="cli/target/${{ matrix.target }}/release/chrome-use"

          # A throwaway keychain, so nothing is added to the runner's login one.
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(openssl rand -hex 20)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$APPLE_SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychain -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          # `--options runtime` is required for notarization. Verified locally
          # that the daemon still starts and drives a browser under it.
          codesign --force --options runtime --timestamp \
            -s "$APPLE_SIGN_IDENTITY" --keychain "$kc" "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          # The same binary as ChromeUse.app, signed as a bundle (see the
          # script). Its executable cannot double as the bare one: a copy
          # taken out of the bundle no longer matches its sealed Info.plist,
          # and the hardened runtime kills it.
          sh scripts/macos-app-bundle.sh "$bin" "$RUNNER_TEMP/bundle" \
            --identity "$APPLE_SIGN_IDENTITY" --keychain "$kc"
          app="$RUNNER_TEMP/bundle/ChromeUse.app"

          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
            mkdir "$RUNNER_TEMP/notarize"
            cp "$bin" "$RUNNER_TEMP/notarize/"
            ditto "$app" "$RUNNER_TEMP/notarize/ChromeUse.app"
            ditto -c -k --keepParent "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --key "$RUNNER_TEMP/asc.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
              --wait --timeout 30m
            rm -rf "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/notarize.zip" "$RUNNER_TEMP/notarize"
            # A bare executable cannot carry a stapled ticket (only .app/.dmg/
            # .pkg can), so Gatekeeper checks its notarization online.
            # Verified: `spctl -a` goes from `rejected` to
            # `accepted / source=Notarized Developer ID`. The bundle holds its
            # ticket, so it passes offline too.
            xcrun stapler staple "$app"
            spctl -a -vv "$app" || echo "::warning::spctl did not accept the stapled ChromeUse.app"
            echo "notarized (bundle stapled; the bare executable cannot hold a ticket)"
          else
            echo "signed but NOT notarized (no App Store Connect key configured)"
          fi

          # The double-clickable installer the extension's setup guide
          # downloads: the stapled bundle in a disk image, signed with the
          # same Developer ID Application identity, notarized and stapled.
          # Opened from Finder, the app installs itself where install.sh
          # would and registers the native host (`chrome-use` Finder-launch
          # setup, cli/src/gui_setup.rs). A pkg would need a Developer ID
          # Installer certificate, which this repo does not have, and an
          # admin password to install.
          sh scripts/macos-dmg.sh "$app" "$RUNNER_TEMP/${{ matrix.asset }}.dmg" \
            --identity "$APPLE_SIGN_IDENTITY" --keychain "$kc"
          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
            xcrun notarytool submit "$RUNNER_TEMP/${{ matrix.asset }}.dmg" \
              --key "$RUNNER_TEMP/asc.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" \
              --wait --timeout 30m
            rm -f "$RUNNER_TEMP/asc.p8"
            xcrun stapler staple "$RUNNER_TEMP/${{ matrix.asset }}.dmg"
            spctl -a -t open --context context:primary-signature -vv "$RUNNER_TEMP/${{ matrix.asset }}.dmg" \
              || echo "::warning::spctl did not accept the stapled disk image"
          fi

          security delete-keychain "$kc" || true

      - name: Build app bundle, ad-hoc signed (macOS, no signing secrets)
        if: env.IS_RELEASE == 'true' && startsWith(matrix.os, 'macos') && env.HAS_SIGNING != 'true'
        run: |
          sh scripts/macos-app-bundle.sh "cli/target/${{ matrix.target }}/release/chrome-use" "$RUNNER_TEMP/bundle"
          # Unsigned: Gatekeeper refuses it on a double-click (a fork's build).
          sh scripts/macos-dmg.sh "$RUNNER_TEMP/bundle/ChromeUse.app" "$RUNNER_TEMP/${{ matrix.asset }}.dmg"

      - name: Package (.tar.gz + .sha256)
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="cli/target/${{ matrix.target }}/release/chrome-use${{ matrix.ext }}"
          # The binary inside every archive is named `chrome-use` (or .exe);
          # install.sh extracts that fixed name regardless of platform.
          cp "$src" "dist/chrome-use${{ matrix.ext }}"
          cp LICENSE dist/LICENSE
          cp cli/src/native/a11y/LICENSE-axe-core.txt dist/LICENSE-axe-core.txt
          cp cli/src/native/a11y/LICENSE-axe-core-THIRD-PARTY.txt dist/LICENSE-axe-core-THIRD-PARTY.txt
          chmod +x "dist/chrome-use${{ matrix.ext }}" || true
          # macOS archives also carry ChromeUse.app; install.sh prefers it.
          # Older installers extract only the bare binary and keep working.
          app=""
          if [ -d "$RUNNER_TEMP/bundle/ChromeUse.app" ]; then
            ditto "$RUNNER_TEMP/bundle/ChromeUse.app" dist/ChromeUse.app
            app=ChromeUse.app
          fi
          # COPYFILE_DISABLE: no AppleDouble (._*) files inside the bundle.
          ( cd dist
            COPYFILE_DISABLE=1 tar czf "${{ matrix.asset }}.tar.gz" \
              "chrome-use${{ matrix.ext }}" \
              $app \
              LICENSE \
              LICENSE-axe-core.txt \
              LICENSE-axe-core-THIRD-PARTY.txt
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
            else
              shasum -a 256 "${{ matrix.asset }}.tar.gz" > "${{ matrix.asset }}.tar.gz.sha256"
            fi
          )
          # macOS: the disk image the extension's setup guide downloads.
          if [ -f "$RUNNER_TEMP/${{ matrix.asset }}.dmg" ]; then
            cp "$RUNNER_TEMP/${{ matrix.asset }}.dmg" dist/
            ( cd dist && shasum -a 256 "${{ matrix.asset }}.dmg" > "${{ matrix.asset }}.dmg.sha256" )
          fi

      - name: Upload artifact
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz*
            dist/${{ matrix.asset }}.dmg*
          compression-level: 0
          retention-days: 3

  release:
    name: Attach binaries to GitHub Release
    needs: build
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '') || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The release job is separate from the build matrix and has no repo by
      # default — check it out (full history + tags) so the changelog step has a
      # git repo to diff. Without this, `git` failed with "not a git repository"
      # and the changelog came out empty.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -la dist

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Extract reviewed release notes
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release-notes.js "$RELEASE_TAG" > release-notes.md

      - name: Attach to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.dmg
            dist/*.dmg.sha256
          fail_on_unmatched_files: true
          body_path: release-notes.md
          append_body: false
