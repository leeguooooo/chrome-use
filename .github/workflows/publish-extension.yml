# Publish ab-connect to the Chrome Web Store from CI, so a release never depends
# on someone uploading a zip by hand.
#
# Fires when extensions/ab-connect.zip changes on main: a repacked package is
# the "ship this" signal. `--if-new` skips the run when the store already has
# that version (published or in review), so re-pushing the same zip is a no-op.
# Also runnable by hand, with a draft option.
#
# A failed run opens (or comments on) an issue labelled `cws-publish`: an
# expired credential silently held 0.5.27-0.5.29 back for weeks.
#
# Credentials: repository secrets CWS_SA_KEY (service-account JSON) and
# CWS_PUBLISHER_ID. See extensions/store/PUBLISHING.md.
name: Publish extension (Chrome Web Store)

on:
  push:
    branches: [main]
    paths: ["extensions/ab-connect.zip"]
  workflow_dispatch:
    inputs:
      draft:
        description: "Upload only, do not submit for review"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the packaged zip matches the manifest
        run: |
          python3 - <<'PY'
          import json, zipfile
          m = json.load(open("extensions/ab-connect/manifest.json"))["version"]
          z = json.loads(zipfile.ZipFile("extensions/ab-connect.zip").read("manifest.json"))
          assert m == z["version"], f"manifest {m} != zip {z['version']}; run scripts/pack-extension.sh and commit the zip"
          assert "key" not in z, "the upload zip must not contain the manifest key"
          print(f"ab-connect {m} ready to publish")
          PY
      - name: Publish
        env:
          CWS_SA_KEY: ${{ secrets.CWS_SA_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          # Fallback for the old OAuth credentials, if still present.
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          DRAFT: ${{ inputs.draft }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          args=""
          [ "$DRAFT" = "true" ] && args="$args --draft"
          # A manual run always uploads; an automatic one only for a new version.
          [ "$MANUAL" = "true" ] || args="$args --if-new"
          python3 scripts/cws.py publish $args 2>&1 | tee publish.log
          python3 scripts/cws.py status 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Report a failed publish
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ver=$(python3 -c "import json;print(json.load(open('extensions/ab-connect/manifest.json'))['version'])")
          body=$(printf 'Publishing ab-connect %s to the Chrome Web Store failed.\n\nRun: %s\n\n```\n%s\n```\n\nSetup and fixes: extensions/store/PUBLISHING.md' \
            "$ver" "$RUN_URL" "$(tail -20 publish.log 2>/dev/null)")
          gh label create cws-publish --color B60205 --description "Chrome Web Store publish failed" 2>/dev/null || true
          open=$(gh issue list --label cws-publish --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Chrome Web Store publish failed (ab-connect $ver)" --label cws-publish --body "$body"
          fi
      - name: Close a resolved failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label cws-publish --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Published fine in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          done
