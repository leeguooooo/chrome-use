name: SEO metadata
on:
  pull_request:
    paths: ['docs/**', '.github/workflows/seo-check.yml']
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/seo-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 docs/_tools/seo.py --check
