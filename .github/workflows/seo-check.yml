name: SEO metadata
on:
  pull_request:
    paths: ['docs/**', '.github/workflows/seo-check.yml']
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/seo-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: python3 docs/_tools/seo.py --check
