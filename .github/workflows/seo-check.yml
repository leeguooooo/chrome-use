name: SEO metadata
on:
  pull_request:
    paths: ['docs/**', '.github/workflows/seo-check.yml']
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/seo-check.yml']
permissions:
  contents: read
# A new commit on a PR makes the older run obsolete. Pushes to main are keyed
# by SHA, so they never cancel or displace each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: python3 docs/_tools/seo.py --check
